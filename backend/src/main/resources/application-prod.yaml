# Production profile - optimized for performance and security
spring:
  jpa:
    show-sql: false  # Disable SQL logging in production
    properties:
      hibernate:
        "[generate_statistics]": false
        "[use_sql_comments]": false  # Reduce payload size
  
  tomcat:
    threads:
      max: 200        # Conservative thread count for production
      min-spare: 10

# Production CORS - Allow frontend origin on Render
# Set CORS_ALLOWED_ORIGINS env var to include your production frontend URL
# Example: CORS_ALLOWED_ORIGINS=https://shopcart-fe-be.onrender.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://shopcart-fe-be.onrender.com}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    com.shopcart: DEBUG  # Show errors and debug info from our application