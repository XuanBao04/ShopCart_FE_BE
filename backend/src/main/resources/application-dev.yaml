spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopcart}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    # hikari:
    #   maximum-pool-size: 50 # tăng số kết nối DB tối đa (mặc định là 10)
    #   minimum-idle: 10    # tăng số kết nối DB tối thiểu
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 500                   # Tăng số lượng luồng xử lý yêu cầu (mặc định là 200)
      min-spare: 50                # Tăng số lượng luồng rảnh (mặc định là 10)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
