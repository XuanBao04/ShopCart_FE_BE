spring:
  application:
    name: shopcart-api
  
  # Datasource configuration - all profiles inherit these defaults
  # Environment variables override defaults for production deployment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopcart}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  
  # JPA/Hibernate configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update  # Default: update schema. Profiles can override
      dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false     # Default: disabled. Dev profile enables for debugging
    properties:
      hibernate:
        "[dialect]": org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true
        "[jdbc.batch_size]": 20
        "[order_inserts]": true
        "[order_updates]": true
        "[use_sql_comments]": true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

# CORS configuration - can be overridden by environment variable or profile
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
      min-spare: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
